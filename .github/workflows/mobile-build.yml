name: MeterGuard mobile builds
on:
  workflow_dispatch:
  push:
    branches: [feature/capacitor-mobile]

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Resolve dependencies and build React
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeterGuard-Android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Android source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeterGuard-Android-project
          path: android/
          if-no-files-found: ignore

  ios:
    name: iOS simulator build (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and build React
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MeterGuard-iOS-simulator-unsigned
          path: ios-build/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error
      - name: Upload iOS project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeterGuard-iOS-project
          path: ios/
          if-no-files-found: ignore
