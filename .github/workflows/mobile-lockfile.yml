name: Refresh mobile dependency lockfile
on:
  workflow_dispatch:
  push:
    branches: [feature/capacitor-mobile]
    paths:
      - package.json
      - .github/workflows/mobile-lockfile.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capacitor-mobile
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate package lock without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(mobile): synchronize Capacitor package lock"
            git push origin HEAD:feature/capacitor-mobile
          fi
